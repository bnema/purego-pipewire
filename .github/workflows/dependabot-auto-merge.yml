name: Dependabot Auto-Merge

on: pull_request

jobs:
  auto-merge:
    # Dependabot runs on GitHub only; the reusable workflow is not on Forgejo.
    if: github.server_url == 'https://github.com' && github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    uses: bnema/gh-actions/.github/workflows/dependabot-auto-merge.yml@main
