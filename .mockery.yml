all: false
template: testify
template-data:
  unroll-variadic: true
formatter: goimports
dir: "{{.InterfaceDir}}/mocks"
pkgname: mocks
filename: "mock_{{.InterfaceName}}.go"
structname: "Mock{{.InterfaceName}}"

packages:
  bnema.dev/purego-pipewire/internal/ports/out:
    config:
      all: false
      include-auto-generated: true
    interfaces:
      CAPI:
      InitAPI:
      LoopAPI:
      StreamOps:
      VideoAPI:
      SharedMemAPI:
      VideoStreamAPI:
  bnema.dev/purego-pipewire/pipewire:
    config:
      all: false
      include-auto-generated: true
    interfaces:
      Runtime:
      MainLoop:
      Player:
  bnema.dev/purego-pipewire/internal/ports/in:
    config:
      all: false
    interfaces:
      VideoHandler:
